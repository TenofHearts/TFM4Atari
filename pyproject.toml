[project]
name = "tfm4atari"
version = "0.1.0"
description = "TabPFN 3.5 trajectory-context learning for Gymnasium Atari"
authors = [
    { name = "Eric", email = "ye_jin2004@163.com" }
]
requires-python = ">=3.10"
dependencies = [
    "gym==0.26.2",
    "gymnasium[atari]>=1.3.0",
    "huggingface-hub>=0.34.0",
    "moviepy>=2.1.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "shimmy>=2.0.0",
    "stable-baselines3>=2.7.0",
    "sb3-contrib>=2.7.0",
    "tabpfn>=9.0.0",
    "tomli>=2.2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
tfm4atari = "tfm4atari:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
