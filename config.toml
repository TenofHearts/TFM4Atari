schema_version = 1
enabled_games = ["BeamRider"]

[paths]
data_dir = "data"
artifact_dir = "artifacts"
video_dir = "videos"

[runtime]
device = "auto"
precision = "auto"
seed = 42
render_mode = "none"
record_video = false
cpu_context_rows = 4000
cuda_context_rows = 10000
n_preprocessing_jobs = 1

[atari]
frameskip = 1
repeat_action_probability = 0.0
wrapper_frame_skip = 4
noop_max = 30
screen_size = 84
terminal_on_life_loss = false
full_action_space = false

[collection]
episodes_per_game = 2
sample_stride = 1
max_decisions_per_episode = 27000
maximum_attempts_per_game = 6

[learning]
episodes = 100

[trajectory_judges]
default = "return_quantile"

[trajectory_judges.games]
BeamRider = "beamrider_symbolic"

[trajectory_judges.return_quantile]
success_quantile = 0.50

[trajectory_judges.beamrider_symbolic]
minimum_score = 44.0
minimum_positive_reward_events = 1
minimum_survival_fraction = 0.80
maximum_lives_lost = 1

[context_cache]
enabled = true
teacher_judgment_capacity = 16
judgment_capacity = 8
refit_every_judged_batches = 32
maximum_rows = 4000
minimum_cold_start_rows = 2000

[context_cache.beamrider]

[evaluation]
random_episodes = 10
teacher_episodes = 10
final_episodes = 30
early_window = 20
late_window = 20

[video]
seed = 9001
max_decisions = 1024
fps = 30
name_prefix = "beamrider-tabpfn"
persist_context_additions = true
teacher_max_decisions = 27000
teacher_name_prefix = "beamrider-teacher"

[tabpfn]
model_path = "tabpfn-v3.5-20260909.safetensors"
cache_dir = "artifacts/tabpfn"
n_estimators = 4
fit_mode = "fit_with_cache"
balance_probabilities = false

[[games]]
name = "BeamRider"
env_id = "ALE/BeamRider-v5"
teacher_backend = "qrdqn"
teacher_repo = "sb3/qrdqn-BeamRiderNoFrameskip-v4"
teacher_file = "qrdqn-BeamRiderNoFrameskip-v4.zip"
teacher_revision = "5b9f0bfd6bba49b1b71adbeac0cd0b6b0d9924ff"

